<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Memorama del Abecedario / Alphabet Memory Game</title>
<meta name="theme-color" content="#bfe0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memorama ABC">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="icon" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #bfe0ff;
    --card-back-1: #ff9d9d;
    --card-back-2: #ffc36e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    flex: 0 0 auto;
    text-align: center;
    padding: 8px 10px 6px;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.1rem;
    color: #2c4a6b;
    letter-spacing: 0.5px;
  }
  #new-game, #lang-switch, #mode-toggle, #sound-toggle {
    border: none;
    background: #2c4a6b;
    color: white;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 18px;
    border-radius: 999px;
    box-shadow: 0 3px 8px rgba(30, 60, 100, 0.3);
    cursor: pointer;
  }
  #lang-switch, #mode-toggle, #sound-toggle {
    background: #6ec3f4;
    margin-left: 8px;
  }
  #sound-toggle.muted {
    background: #9aa7b5;
  }
  #new-game:active, #lang-switch:active, #mode-toggle:active, #sound-toggle:active {
    transform: scale(0.95);
  }
  .header-buttons {
    display: flex;
    justify-content: center;
    gap: 8px;
  }

  #lang-screen {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 20px;
  }
  #lang-screen h1 {
    margin: 0 0 10px;
    font-size: 1.4rem;
    color: #2c4a6b;
    text-align: center;
  }
  .lang-btn {
    border: none;
    background: white;
    color: #2c4a6b;
    font-size: 1.3rem;
    font-weight: 700;
    padding: 22px 40px;
    border-radius: 20px;
    box-shadow: 0 4px 12px rgba(30, 60, 100, 0.3);
    cursor: pointer;
    width: 260px;
  }
  .lang-btn:active {
    transform: scale(0.96);
  }
  .hidden {
    display: none !important;
  }

  #grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    padding: 8px 10px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    min-height: 0;
  }

  .card {
    perspective: 1000px;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    min-height: 0;
    min-width: 0;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card.matched .card-inner {
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    0%   { transform: rotateY(180deg) scale(1); }
    50%  { transform: rotateY(180deg) scale(1.1); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .card.matched {
    opacity: 0.55;
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 3px 8px rgba(30, 60, 100, 0.25);
  }
  .card-back {
    background: linear-gradient(135deg, var(--card-back-1), var(--card-back-2));
    color: rgba(255,255,255,0.85);
    font-size: clamp(1.1rem, 6vw, 2rem);
    font-weight: 800;
  }
  .card-front {
    transform: rotateY(180deg);
    background: #ffffff;
  }
  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }
  .card-front.letter-face {
    font-size: clamp(1.3rem, 7vw, 2.4rem);
    font-weight: 800;
  }
  .card-front.word-face {
    font-size: clamp(0.65rem, 4.5vw, 1.25rem);
    font-weight: 800;
    text-align: center;
    padding: 4px;
    line-height: 1.15;
    word-break: break-word;
  }

  #win-banner {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(44, 74, 107, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 20;
  }
  #win-banner.show {
    opacity: 1;
    pointer-events: auto;
  }
  #win-banner .box {
    background: white;
    border-radius: 24px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    max-width: 320px;
  }
  #win-banner .box p {
    font-size: 1.5rem;
    margin: 0 0 18px;
    color: #2c4a6b;
    font-weight: 700;
  }
  #win-banner .box button {
    border: none;
    background: #2c4a6b;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 26px;
    border-radius: 999px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div id="lang-screen">
  <h1>Elige un idioma<br>Choose a language</h1>
  <button class="lang-btn" data-lang="es">🇪🇸 Español</button>
  <button class="lang-btn" data-lang="en">🇬🇧 English</button>
</div>

<header class="hidden">
  <h1 id="title">Memorama del Abecedario 🔤</h1>
  <div class="header-buttons">
    <button id="new-game">Nuevo juego</button>
    <button id="lang-switch">🌐</button>
    <button id="mode-toggle">🔢</button>
    <button id="sound-toggle">🔊</button>
  </div>
</header>

<div id="grid" class="hidden"></div>

<div id="win-banner">
  <div class="box">
    <p id="win-msg">¡Muy bien! 🎉</p>
    <button id="play-again">Jugar otra vez</button>
  </div>
</div>

<script>
  const LANGS = {
    es: {
      newGameBtn: "Nuevo juego",
      winMsg: "¡Muy bien! 🎉",
      playAgainBtn: "Jugar otra vez",
      ttsLang: "es-MX",
      modes: {
        alpha: {
          title: "Memorama del Abecedario 🔤",
          imgFolder: "images",
          slots: ["image", "symbol"],
          items: {
            A: "a", B: "be", C: "ce", D: "de", E: "e", F: "efe",
            G: "ge", H: "hache", I: "i", J: "jota", K: "ka", L: "ele",
            M: "eme", N: "ene", "Ñ": "eñe", O: "o", P: "pe", Q: "cu",
            R: "erre", S: "ese", T: "te", U: "u", V: "ve", W: "doble u",
            X: "equis", Y: "ye", Z: "zeta"
          }
        },
        numbers: {
          title: "Memorama de Números 🔢",
          slots: ["symbol", "word"],
          items: {
            0: "cero", 1: "uno", 2: "dos", 3: "tres", 4: "cuatro",
            5: "cinco", 6: "seis", 7: "siete", 8: "ocho", 9: "nueve", 10: "diez",
            11: "once", 12: "doce", 13: "trece", 14: "catorce", 15: "quince",
            16: "dieciséis", 17: "diecisiete", 18: "dieciocho", 19: "diecinueve", 20: "veinte",
            21: "veintiuno", 22: "veintidós", 23: "veintitrés", 24: "veinticuatro", 25: "veinticinco",
            26: "veintiséis", 27: "veintisiete", 28: "veintiocho", 29: "veintinueve", 30: "treinta",
            31: "treinta y uno", 32: "treinta y dos", 33: "treinta y tres", 34: "treinta y cuatro", 35: "treinta y cinco",
            36: "treinta y seis", 37: "treinta y siete", 38: "treinta y ocho", 39: "treinta y nueve", 40: "cuarenta",
            50: "cincuenta", 60: "sesenta", 70: "setenta", 80: "ochenta", 90: "noventa", 100: "cien"
          }
        }
      }
    },
    en: {
      newGameBtn: "New game",
      winMsg: "Great job! 🎉",
      playAgainBtn: "Play again",
      ttsLang: "en-US",
      modes: {
        alpha: {
          title: "Alphabet Memory Game 🔤",
          imgFolder: "images/en",
          slots: ["image", "symbol"],
          items: {
            A: "A", B: "B", C: "C", D: "D", E: "E", F: "F",
            G: "G", H: "H", I: "I", J: "J", K: "K", L: "L",
            M: "M", N: "N", O: "O", P: "P", Q: "Q",
            R: "R", S: "S", T: "T", U: "U", V: "V", W: "W",
            X: "X", Y: "Y", Z: "Z"
          }
        },
        numbers: {
          title: "Numbers Memory Game 🔢",
          slots: ["symbol", "word"],
          items: {
            0: "zero", 1: "one", 2: "two", 3: "three", 4: "four",
            5: "five", 6: "six", 7: "seven", 8: "eight", 9: "nine", 10: "ten",
            11: "eleven", 12: "twelve", 13: "thirteen", 14: "fourteen", 15: "fifteen",
            16: "sixteen", 17: "seventeen", 18: "eighteen", 19: "nineteen", 20: "twenty",
            21: "twenty-one", 22: "twenty-two", 23: "twenty-three", 24: "twenty-four", 25: "twenty-five",
            26: "twenty-six", 27: "twenty-seven", 28: "twenty-eight", 29: "twenty-nine", 30: "thirty",
            31: "thirty-one", 32: "thirty-two", 33: "thirty-three", 34: "thirty-four", 35: "thirty-five",
            36: "thirty-six", 37: "thirty-seven", 38: "thirty-eight", 39: "thirty-nine", 40: "forty",
            50: "fifty", 60: "sixty", 70: "seventy", 80: "eighty", 90: "ninety", 100: "one hundred"
          }
        }
      }
    }
  };

  const MODE_ICONS = { alpha: "🔢", numbers: "🔤" };

  const LETTER_COLORS = ["#ff8a8a", "#ffb347", "#8bd17c", "#6ec3f4"];
  const PAIRS_PER_GAME = 8;

  const grid = document.getElementById('grid');
  const winBanner = document.getElementById('win-banner');
  const langScreen = document.getElementById('lang-screen');
  const header = document.querySelector('header');

  let lang = null;
  let mode = 'alpha';
  let allKeys = [];
  let flipped = [];
  let lock = false;
  let matchedCount = 0;
  let cards = [];
  let soundEnabled = localStorage.getItem('soundEnabled') !== 'false';

  function currentMode() {
    return LANGS[lang].modes[mode];
  }

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function speak(text) {
    if (!soundEnabled) return;
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = LANGS[lang].ttsLang;
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }

  let audioCtx = null;
  function playFlipSound() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    } catch (e) {}
  }

  function buildCardEl(card, index) {
    const btn = document.createElement('button');
    btn.className = 'card';
    btn.dataset.index = index;

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('div');
    back.className = 'card-face card-back';
    back.textContent = '?';

    const front = document.createElement('div');
    front.className = 'card-face card-front';
    const color = LETTER_COLORS[allKeys.indexOf(card.key) % LETTER_COLORS.length];

    if (card.slot === 'image') {
      const img = document.createElement('img');
      img.src = `${currentMode().imgFolder}/${card.key}.webp`;
      img.alt = card.key;
      img.draggable = false;
      front.appendChild(img);
    } else if (card.slot === 'symbol') {
      front.classList.add('letter-face');
      front.textContent = card.key;
      front.style.color = color;
    } else {
      front.classList.add('word-face');
      front.textContent = currentMode().items[card.key];
      front.style.color = color;
    }

    inner.appendChild(back);
    inner.appendChild(front);
    btn.appendChild(inner);

    btn.addEventListener('click', () => onCardClick(index));
    return btn;
  }

  function newGame() {
    window.speechSynthesis.cancel();
    flipped = [];
    lock = false;
    matchedCount = 0;
    winBanner.classList.remove('show');

    const [slotA, slotB] = currentMode().slots;
    const chosenKeys = shuffle(allKeys).slice(0, PAIRS_PER_GAME);
    const rawCards = [];
    chosenKeys.forEach(key => {
      rawCards.push({ key, slot: slotA });
      rawCards.push({ key, slot: slotB });
    });
    cards = shuffle(rawCards);

    grid.innerHTML = '';
    cards.forEach((card, index) => {
      grid.appendChild(buildCardEl(card, index));
    });
  }

  function onCardClick(index) {
    if (lock) return;
    const cardEl = grid.children[index];
    if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
    if (flipped.length === 2) return;

    cardEl.classList.add('flipped');
    playFlipSound();
    speak(currentMode().items[cards[index].key]);
    flipped.push(index);

    if (flipped.length === 2) {
      const [i1, i2] = flipped;
      if (cards[i1].key === cards[i2].key) {
        lock = true;
        setTimeout(() => {
          grid.children[i1].classList.add('matched');
          grid.children[i2].classList.add('matched');
          flipped = [];
          lock = false;
          matchedCount++;
          if (matchedCount === PAIRS_PER_GAME) {
            setTimeout(() => winBanner.classList.add('show'), 500);
          }
        }, 350);
      } else {
        lock = true;
        setTimeout(() => {
          grid.children[i1].classList.remove('flipped');
          grid.children[i2].classList.remove('flipped');
          flipped = [];
          lock = false;
        }, 1200);
      }
    }
  }

  function selectLang(code) {
    lang = code;
    mode = 'alpha';
    allKeys = Object.keys(LANGS[code].modes.alpha.items);
    document.getElementById('title').textContent = currentMode().title;
    document.getElementById('new-game').textContent = LANGS[code].newGameBtn;
    document.getElementById('win-msg').textContent = LANGS[code].winMsg;
    document.getElementById('play-again').textContent = LANGS[code].playAgainBtn;
    document.documentElement.lang = LANGS[code].ttsLang;
    updateModeButton();

    langScreen.classList.add('hidden');
    header.classList.remove('hidden');
    grid.classList.remove('hidden');

    newGame();
  }

  function updateModeButton() {
    document.getElementById('mode-toggle').textContent = MODE_ICONS[mode];
  }

  function toggleMode() {
    mode = mode === 'alpha' ? 'numbers' : 'alpha';
    allKeys = Object.keys(currentMode().items);
    document.getElementById('title').textContent = currentMode().title;
    updateModeButton();
    newGame();
  }

  function updateSoundButton() {
    const btn = document.getElementById('sound-toggle');
    btn.textContent = soundEnabled ? '🔊' : '🔇';
    btn.classList.toggle('muted', !soundEnabled);
  }

  function toggleSound() {
    soundEnabled = !soundEnabled;
    localStorage.setItem('soundEnabled', soundEnabled ? 'true' : 'false');
    if (!soundEnabled) window.speechSynthesis.cancel();
    updateSoundButton();
  }

  function showLangScreen() {
    window.speechSynthesis.cancel();
    winBanner.classList.remove('show');
    langScreen.classList.remove('hidden');
    header.classList.add('hidden');
    grid.classList.add('hidden');
  }

  document.querySelectorAll('.lang-btn').forEach(btn => {
    btn.addEventListener('click', () => selectLang(btn.dataset.lang));
  });
  document.getElementById('new-game').addEventListener('click', newGame);
  document.getElementById('play-again').addEventListener('click', newGame);
  document.getElementById('lang-switch').addEventListener('click', showLangScreen);
  document.getElementById('mode-toggle').addEventListener('click', toggleMode);
  document.getElementById('sound-toggle').addEventListener('click', toggleSound);
  updateSoundButton();

  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }
</script>

</body>
</html>
