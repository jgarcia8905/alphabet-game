<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Memorama del Abecedario</title>
<meta name="theme-color" content="#bfe0ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Memorama ABC">
<link rel="apple-touch-icon" href="images/icon-192.png">
<link rel="icon" href="images/icon-192.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #bfe0ff;
    --card-back-1: #ff9d9d;
    --card-back-2: #ffc36e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overscroll-behavior: none;
    user-select: none;
    -webkit-user-select: none;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: flex;
    flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    flex: 0 0 auto;
    text-align: center;
    padding: 8px 10px 6px;
  }
  header h1 {
    margin: 0 0 6px;
    font-size: 1.1rem;
    color: #2c4a6b;
    letter-spacing: 0.5px;
  }
  #new-game {
    border: none;
    background: #2c4a6b;
    color: white;
    font-size: 0.85rem;
    font-weight: 600;
    padding: 7px 18px;
    border-radius: 999px;
    box-shadow: 0 3px 8px rgba(30, 60, 100, 0.3);
    cursor: pointer;
  }
  #new-game:active {
    transform: scale(0.95);
  }

  #grid {
    flex: 1 1 auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap: 8px;
    padding: 8px 10px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    min-height: 0;
  }

  .card {
    perspective: 1000px;
    border: none;
    background: none;
    padding: 0;
    cursor: pointer;
    min-height: 0;
    min-width: 0;
  }
  .card-inner {
    position: relative;
    width: 100%;
    height: 100%;
    transition: transform 0.5s cubic-bezier(.4,.2,.2,1);
    transform-style: preserve-3d;
  }
  .card.flipped .card-inner {
    transform: rotateY(180deg);
  }
  .card.matched .card-inner {
    animation: pop 0.4s ease;
  }
  @keyframes pop {
    0%   { transform: rotateY(180deg) scale(1); }
    50%  { transform: rotateY(180deg) scale(1.1); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  .card.matched {
    opacity: 0.55;
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 18px;
    backface-visibility: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    box-shadow: 0 3px 8px rgba(30, 60, 100, 0.25);
  }
  .card-back {
    background: linear-gradient(135deg, var(--card-back-1), var(--card-back-2));
    color: rgba(255,255,255,0.85);
    font-size: clamp(1.1rem, 6vw, 2rem);
    font-weight: 800;
  }
  .card-front {
    transform: rotateY(180deg);
    background: #ffffff;
  }
  .card-front img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    pointer-events: none;
  }
  .card-front.letter-face {
    font-size: clamp(1.3rem, 7vw, 2.4rem);
    font-weight: 800;
  }

  #win-banner {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(44, 74, 107, 0.55);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 20;
  }
  #win-banner.show {
    opacity: 1;
    pointer-events: auto;
  }
  #win-banner .box {
    background: white;
    border-radius: 24px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.35);
    max-width: 320px;
  }
  #win-banner .box p {
    font-size: 1.5rem;
    margin: 0 0 18px;
    color: #2c4a6b;
    font-weight: 700;
  }
  #win-banner .box button {
    border: none;
    background: #2c4a6b;
    color: white;
    font-size: 1rem;
    font-weight: 600;
    padding: 12px 26px;
    border-radius: 999px;
    cursor: pointer;
  }
</style>
</head>
<body>

<header>
  <h1>Memorama del Abecedario 🔤</h1>
  <button id="new-game">Nuevo juego</button>
</header>

<div id="grid"></div>

<div id="win-banner">
  <div class="box">
    <p>¡Muy bien! 🎉</p>
    <button id="play-again">Jugar otra vez</button>
  </div>
</div>

<script>
  const LETTER_INFO = {
    A: "a", B: "be", C: "ce", D: "de", E: "e", F: "efe",
    G: "ge", H: "hache", I: "i", J: "jota", K: "ka", L: "ele",
    M: "eme", N: "ene", "Ñ": "eñe", O: "o", P: "pe", Q: "cu",
    R: "erre", S: "ese", T: "te", U: "u", V: "ve", W: "doble u",
    X: "equis", Y: "ye", Z: "zeta"
  };
  const ALL_LETTERS = Object.keys(LETTER_INFO);
  const LETTER_COLORS = ["#ff8a8a", "#ffb347", "#8bd17c", "#6ec3f4"];
  const PAIRS_PER_GAME = 8;

  const grid = document.getElementById('grid');
  const winBanner = document.getElementById('win-banner');

  let flipped = [];
  let lock = false;
  let matchedCount = 0;

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function speak(text) {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'es-MX';
    utter.rate = 0.9;
    window.speechSynthesis.speak(utter);
  }

  function buildCardEl(card, index) {
    const btn = document.createElement('button');
    btn.className = 'card';
    btn.dataset.index = index;

    const inner = document.createElement('div');
    inner.className = 'card-inner';

    const back = document.createElement('div');
    back.className = 'card-face card-back';
    back.textContent = '?';

    const front = document.createElement('div');
    front.className = 'card-face card-front';

    if (card.type === 'image') {
      const img = document.createElement('img');
      img.src = `images/${card.letter}.webp`;
      img.alt = card.letter;
      img.draggable = false;
      front.appendChild(img);
    } else {
      front.classList.add('letter-face');
      front.textContent = card.letter;
      front.style.color = LETTER_COLORS[ALL_LETTERS.indexOf(card.letter) % LETTER_COLORS.length];
    }

    inner.appendChild(back);
    inner.appendChild(front);
    btn.appendChild(inner);

    btn.addEventListener('click', () => onCardClick(index));
    return btn;
  }

  let cards = [];

  function newGame() {
    window.speechSynthesis.cancel();
    flipped = [];
    lock = false;
    matchedCount = 0;
    winBanner.classList.remove('show');

    const chosenLetters = shuffle(ALL_LETTERS).slice(0, PAIRS_PER_GAME);
    const rawCards = [];
    chosenLetters.forEach(letter => {
      rawCards.push({ letter, type: 'image' });
      rawCards.push({ letter, type: 'letter' });
    });
    cards = shuffle(rawCards);

    grid.innerHTML = '';
    cards.forEach((card, index) => {
      grid.appendChild(buildCardEl(card, index));
    });
  }

  function onCardClick(index) {
    if (lock) return;
    const cardEl = grid.children[index];
    if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;
    if (flipped.length === 2) return;

    cardEl.classList.add('flipped');
    speak(LETTER_INFO[cards[index].letter]);
    flipped.push(index);

    if (flipped.length === 2) {
      const [i1, i2] = flipped;
      if (cards[i1].letter === cards[i2].letter) {
        lock = true;
        setTimeout(() => {
          grid.children[i1].classList.add('matched');
          grid.children[i2].classList.add('matched');
          flipped = [];
          lock = false;
          matchedCount++;
          if (matchedCount === PAIRS_PER_GAME) {
            setTimeout(() => winBanner.classList.add('show'), 500);
          }
        }, 350);
      } else {
        lock = true;
        setTimeout(() => {
          grid.children[i1].classList.remove('flipped');
          grid.children[i2].classList.remove('flipped');
          flipped = [];
          lock = false;
        }, 1200);
      }
    }
  }

  document.getElementById('new-game').addEventListener('click', newGame);
  document.getElementById('play-again').addEventListener('click', newGame);

  if ('speechSynthesis' in window) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  newGame();
</script>

</body>
</html>
